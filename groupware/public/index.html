<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사내 그룹웨어 · 대시보드 · 출퇴근 · 주간보고 · 연차 · 결재 관리 · 문서 · 회의실 예약</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chatbot.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="주 메뉴 목차">
      <div class="sidebar-brand">
        <a href="#/home" id="home-btn" class="home-brand-btn" aria-label="대시보드로 이동">
          <span class="brand-mark" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 21h18"></path>
              <path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"></path>
              <path d="M9 7h1"></path>
              <path d="M14 7h1"></path>
              <path d="M9 11h1"></path>
              <path d="M14 11h1"></path>
              <path d="M9 21v-5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v5"></path>
            </svg>
          </span>
          <span class="brand-text">
            <span class="brand-title">사내 그룹웨어</span>
            <span class="brand-sub">Groupware</span>
          </span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <a href="#/home" class="sidebar-link" data-route="home">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          </svg>
          <span class="nav-label">대시보드</span>
        </a>

        <a href="#/attendance" class="sidebar-link" data-route="attendance">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <polyline points="12 7 12 12 15.5 14"></polyline>
          </svg>
          <span class="nav-label">출퇴근</span>
        </a>

        <a href="#/weekly" class="sidebar-link" data-route="weekly">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="8" y1="13" x2="16" y2="13"></line>
            <line x1="8" y1="17" x2="13" y2="17"></line>
          </svg>
          <span class="nav-label">주간보고</span>
        </a>

        <a href="#/leave" class="sidebar-link" data-route="leave">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span class="nav-label">연차</span>
        </a>

        <div class="sidebar-group" data-route-group="approvals">
          <a href="#/approvals/leave" class="sidebar-link" data-route="approvals">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 11l3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
            <span class="nav-label">결재 관리</span>
            <span id="nav-approvals-badge" class="nav-badge sr-only is-hidden" hidden>0</span>
          </a>

          <div class="sidebar-subnav" data-subnav="approvals">
            <a href="#/approvals/leave" class="sidebar-sublink" data-route="approvals" data-subroute="leave">
              <span class="nav-subdot" aria-hidden="true"></span>
              <span class="nav-label">연차 결재</span>
              <span id="nav-leave-approvals-badge" class="nav-badge is-hidden" hidden>0</span>
            </a>
            <a href="#/approvals/weekly" class="sidebar-sublink" data-route="approvals" data-subroute="weekly">
              <span class="nav-subdot" aria-hidden="true"></span>
              <span class="nav-label">주간보고 결재</span>
              <span id="nav-weekly-approvals-badge" class="nav-badge is-hidden" hidden>0</span>
            </a>
          </div>
        </div>

        <a href="#/docs" class="sidebar-link" data-route="docs">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            <line x1="8" y1="7" x2="16" y2="7"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
          <span class="nav-label">문서</span>
        </a>

        <a href="#/rooms" class="sidebar-link" data-route="rooms">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 21h18"></path>
            <path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"></path>
            <path d="M9 9h6"></path>
            <path d="M9 13h6"></path>
          </svg>
          <span class="nav-label">회의실 예약</span>
          <span class="nav-tag">마곡</span>
        </a>
      </nav>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="topbar-left">
            <span class="workspace-label">업무 공간</span>
          </div>

          <div class="topbar-right">
            <div class="user-switcher">
              <div class="user-chip">
                <span id="user-avatar" class="user-avatar" aria-hidden="true">-</span>
                <div class="user-chip-text">
                  <span id="user-display-name" class="user-display-name">-</span>
                  <span id="user-display-role" class="user-display-role">-</span>
                </div>
              </div>
              <label for="user-select" class="sr-only">사용자 전환</label>
              <select id="user-select" class="user-select" disabled>
                <option value="">사용자 불러오는 중...</option>
              </select>
              <span id="role-badge" class="role-badge is-hidden" hidden></span>
            </div>
          </div>
        </div>
      </header>

      <main class="main-content">
        <div id="global-error" class="alert alert-error is-hidden" role="alert" hidden>
          <span id="global-error-text"></span>
          <button type="button" id="global-retry-btn" class="btn btn-sm btn-outline">다시 시도</button>
        </div>

        <div id="route-view" class="route-view"></div>
      </main>
    </div>
  </div>

  <div id="modal-backdrop" class="modal-backdrop is-hidden" hidden>
    <div id="modal-dialog" class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title"></h3>
        <button type="button" id="modal-close-btn" class="modal-close" aria-label="창 닫기">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast is-hidden" role="status" aria-live="polite" hidden>
    <span id="toast-text"></span>
    <button type="button" id="toast-close-btn" class="toast-close" aria-label="알림 닫기">&times;</button>
  </div>

  <script src="app.js"></script>
  <script src="chatbot.js"></script>
</body>
</html>
